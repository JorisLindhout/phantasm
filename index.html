<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluidLock - SVG Canvas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>FluidLock</h1>
        <div class="canvases-wrapper">
            <div class="canvas-section">
                <h2>Template Canvas</h2>
                <div class="canvas-container">
                    <div class="loading" id="loading">Loading SVG...</div>
                    <canvas id="templateCanvas"></canvas>
                    <div class="template-grid-overlay" id="templateGridOverlay">
                        <div class="template-grid-lines" id="templateGridLines"></div>
                        <div class="template-grid-labels" id="templateGridLabels"></div>
                    </div>
                </div>
            </div>
            <div class="canvas-section">
                <h2>Workspace Canvas</h2>
                <div class="canvas-container">
                    <div class="pieces-container" id="piecesContainer">
                        <!-- Individual pieces will be generated here -->
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <h3>Grid Controls</h3>
            <div class="control-group">
                <label for="gridSize">Grid Size:</label>
                <select id="gridSize" onchange="changeGridSize()">
                    <option value="4" selected>4x4 (16 pieces)</option>
                    <option value="5">5x5 (25 pieces)</option>
                    <option value="6">6x6 (36 pieces)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="wavyEnabled">Wavy Grid:</label>
                <input type="checkbox" id="wavyEnabled" onchange="toggleWavyGrid()">
            </div>
            <div class="control-group">
                <button onclick="debugGrid()">Debug Grid</button>
                <button onclick="resetPieces()">Reset Pieces</button>
            </div>
        </div>
        <div class="info">
            Original SVG: 850×478px | Canvas: 1700×956px (2x scale) | Tethered Pieces
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
