<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Phantasm</title>
    <meta name="description" content="A web-based Voronoi puzzle with WebGL 3D rendering. Release pieces in batches, snap them into place, and progress through animated levels.">
    <meta name="theme-color" content="#081546">
    <meta name="application-name" content="Phantasm">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Phantasm">
    <meta property="og:title" content="Phantasm">
    <meta property="og:description" content="A web-based Voronoi puzzle with WebGL 3D rendering. Release pieces in batches, snap them into place, and progress through animated levels.">
    <meta property="og:image" content="/web-app-manifest-512x512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Phantasm puzzle game icon">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Phantasm">
    <meta name="twitter:description" content="A web-based Voronoi puzzle with WebGL 3D rendering. Release pieces in batches, snap them into place, and progress through animated levels.">
    <meta name="twitter:image" content="/web-app-manifest-512x512.png">
    <meta name="twitter:image:alt" content="Phantasm puzzle game icon">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Phantasm">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#puzzleCanvas">Skip to puzzle</a>

    <div id="a11yLiveRegion" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
        <div class="loading-content">
            <p class="loading-text">Loading Phantasm...</p>
            <div class="loading-bar" aria-hidden="true"></div>
            <svg class="heartbeat-gradient" width="238" height="232" viewBox="0 0 238 232" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <ellipse cx="119" cy="116" rx="119" ry="116" fill="url(#paint0_radial_1354_28)" fill-opacity="0.8"/>
                <defs>
                    <radialGradient id="paint0_radial_1354_28" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(119 116) rotate(90) scale(116 119)">
                        <stop stop-color="#00CCFF"/>
                        <stop offset="1" stop-opacity="0"/>
                    </radialGradient>
                </defs>
            </svg>
        </div>
    </div>

    <div class="container">
        <div class="puzzle-container">
            <div class="stage">
                <canvas
                    id="voronoiCanvas"
                    role="img"
                    aria-label="Interactive Voronoi puzzle. Use mouse, touch, or keyboard arrows to select and move pieces."
                    tabindex="0"
                ></canvas>
            </div>
        </div>
    </div>

    <button
        type="button"
        id="releasePiecesBtn"
        class="release-pieces-btn"
        aria-label="Release more puzzle pieces"
    >+</button>

    <div id="completionOverlay" class="completion-overlay" hidden>
        <div class="completion-gradient" aria-hidden="true"></div>
        <h1 class="completion-word">done</h1>
        <button type="button" id="playAgainBtn" class="completion-play-again">Play again</button>
    </div>

    <!-- Audio elements (optional - add assets/sounds/snap.webm and snap.mp3 to enable) -->
    <audio id="snapSound" preload="none"></audio>

    <!-- Controls Drawer -->
    <aside class="controls-drawer" id="controlsDrawer" aria-label="Puzzle settings" aria-hidden="true">
        <button
            class="drawer-toggle"
            id="drawerToggle"
            type="button"
            aria-label="Toggle puzzle settings"
            aria-expanded="false"
            aria-controls="controlsContent"
        >
            <svg class="caret-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 14l5-5 5 5z" fill="currentColor"/>
            </svg>
        </button>

        <div class="controls-content" id="controlsContent">
            <div class="control-group">
                <label for="levelSelector">Level:</label>
                <select id="levelSelector"></select>
            </div>
            <div class="control-group">
                <label for="cellCount">Cell Count:</label>
                <input type="range" id="cellCount" min="5" max="60" value="40" aria-valuemin="5" aria-valuemax="60" aria-valuenow="40" aria-valuetext="40">
                <span id="cellCountValue" aria-hidden="true">40</span>
            </div>
            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.1" max="2.0" step="0.1" value="1.0" aria-valuemin="0.1" aria-valuemax="2" aria-valuenow="1" aria-valuetext="1.0">
                <span id="animationSpeedValue" aria-hidden="true">1.0</span>
            </div>
            <div class="control-group">
                <label for="noiseAmplitude">Noise Amplitude:</label>
                <input type="range" id="noiseAmplitude" min="0" max="50" value="10" aria-valuemin="0" aria-valuemax="50" aria-valuenow="10" aria-valuetext="10">
                <span id="noiseAmplitudeValue" aria-hidden="true">10</span>
            </div>
            <div class="control-group">
                <button type="button" data-action="regenerate">Regenerate Puzzle</button>
                <button type="button" data-action="toggle-animation">Pause Animation</button>
                <button type="button" data-action="toggle-grid-outlines">Toggle Grid Outlines</button>
            </div>
        </div>
    </aside>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
