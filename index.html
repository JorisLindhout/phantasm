<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Phantasm</title>
    <meta name="description" content="Phantasm is a spectral puzzle of shifting shapes. Pieces drift in from the dark, snap into place, until the hidden image finally holds.">
    <meta name="theme-color" content="#081546">
    <meta name="application-name" content="Phantasm">
    <meta name="author" content="Joris Lindhout">

    <link rel="author" href="https://joris.wtf/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LD7RVG5RBE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-LD7RVG5RBE');
    </script>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Phantasm">
    <meta property="og:title" content="Phantasm">
    <meta property="og:description" content="Phantasm is a spectral puzzle of shifting shapes. Pieces drift in from the dark, snap into place, until the hidden image finally holds.">
    <meta property="og:image" content="/web-app-manifest-512x512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Phantasm puzzle game icon">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Phantasm">
    <meta name="twitter:description" content="Phantasm is a spectral puzzle of shifting shapes. Pieces drift in from the dark, snap into place, until the hidden image finally holds.">
    <meta name="twitter:image" content="/web-app-manifest-512x512.png">
    <meta name="twitter:image:alt" content="Phantasm puzzle game icon">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Phantasm">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Phantasm",
        "description": "Phantasm is a spectral puzzle of shifting shapes. Pieces drift in from the dark, snap into place, until the hidden image finally holds.",
        "url": "https://phantasm.joris.wtf/",
        "author": {
            "@type": "Person",
            "name": "Joris Lindhout",
            "url": "https://joris.wtf/"
        },
        "genre": "Puzzle",
        "playMode": "SinglePlayer",
        "applicationCategory": "Game"
    }
    </script>

    <link rel="stylesheet" href="styles.css">
    <style>
        /* Cover the stage before the bundle/CSS finishes loading */
        body.is-app-loading {
            background: #111;
        }

        body.is-app-loading .container,
        body.is-app-loading #releasePiecesBtn,
        body.is-app-loading #completionOverlay {
            visibility: hidden;
        }

        body.is-app-loading .skip-link {
            visibility: hidden;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(17, 17, 17, 0.991);
        }
    </style>
</head>
<body class="is-app-loading" aria-busy="true">
    <script>window.__phantasmLoadingStart = performance.now();</script>
    <a class="skip-link" href="#voronoiCanvas" aria-hidden="true" tabindex="-1">Skip to puzzle</a>

    <div id="a11yLiveRegion" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay visible" role="status" aria-busy="true">
        <div class="loading-gradient-zoom">
            <svg class="loading-gradient-heartbeat" viewBox="0 0 238 232" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <ellipse cx="119" cy="116" rx="119" ry="116" fill="url(#loadingGradient)" fill-opacity="0.8"/>
                <defs>
                    <radialGradient id="loadingGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(119 116) rotate(90) scale(116 119)">
                        <stop stop-color="#00CCFF"/>
                        <stop offset="1" stop-opacity="0"/>
                    </radialGradient>
                </defs>
            </svg>
        </div>
        <span class="visually-hidden">Loading Phantasm</span>
    </div>

    <div class="container" aria-busy="true">
        <div class="puzzle-container">
            <div class="stage">
                <canvas
                    id="voronoiCanvas"
                    role="img"
                    aria-label="Interactive Voronoi puzzle. Use mouse, touch, or keyboard arrows to select and move pieces."
                    tabindex="0"
                ></canvas>
            </div>
        </div>
    </div>

    <button
        type="button"
        id="releasePiecesBtn"
        class="release-pieces-btn"
        aria-label="Release more puzzle pieces"
    >
        <svg class="release-pieces-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="releasePiecesGradV" gradientUnits="userSpaceOnUse" x1="12" y1="5" x2="12" y2="19">
                    <stop offset="0%" style="stop-color: var(--level-gradient-start, #888888)" />
                    <stop offset="100%" style="stop-color: var(--level-gradient-end, #aaaaaa)" />
                </linearGradient>
                <linearGradient id="releasePiecesGradH" gradientUnits="userSpaceOnUse" x1="5" y1="12" x2="19" y2="12">
                    <stop offset="0%" style="stop-color: var(--level-gradient-start, #888888)" />
                    <stop offset="100%" style="stop-color: var(--level-gradient-end, #aaaaaa)" />
                </linearGradient>
            </defs>
            <path
                class="release-pieces-btn__glyph release-pieces-btn__glyph--vertical"
                d="M12 5v14"
                fill="none"
                stroke="url(#releasePiecesGradV)"
                stroke-width="3"
                stroke-linecap="round"
            />
            <path
                class="release-pieces-btn__glyph release-pieces-btn__glyph--horizontal"
                d="M5 12h14"
                fill="none"
                stroke="url(#releasePiecesGradH)"
                stroke-width="3"
                stroke-linecap="round"
            />
        </svg>
    </button>

    <div id="completionOverlay" class="completion-overlay" hidden>
        <div class="completion-gradient" aria-hidden="true"></div>
        <h1 class="completion-word">done</h1>
        <button type="button" id="playAgainBtn" class="completion-play-again">Play again</button>
    </div>

    <!-- Controls Drawer -->
    <aside class="controls-drawer" id="controlsDrawer" aria-label="Puzzle settings" aria-hidden="true">
        <button
            class="drawer-toggle"
            id="drawerToggle"
            type="button"
            aria-label="Toggle puzzle settings"
            aria-expanded="false"
            aria-controls="controlsContent"
        >
            <svg class="caret-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M7 14l5-5 5 5z" fill="currentColor"/>
            </svg>
        </button>

        <div class="controls-content" id="controlsContent">
            <div class="control-group">
                <label for="levelSelector">Level:</label>
                <select id="levelSelector"></select>
            </div>
            <div class="control-group">
                <label for="cellCount">Cell Count:</label>
                <input type="range" id="cellCount" min="5" max="80" value="40" aria-valuemin="5" aria-valuemax="80" aria-valuenow="40" aria-valuetext="40">
                <span id="cellCountValue" aria-hidden="true">40</span>
            </div>
            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.1" max="2.0" step="0.1" value="1.0" aria-valuemin="0.1" aria-valuemax="2" aria-valuenow="1" aria-valuetext="1.0">
                <span id="animationSpeedValue" aria-hidden="true">1.0</span>
            </div>
            <div class="control-group">
                <label for="noiseAmplitude">Noise Amplitude:</label>
                <input type="range" id="noiseAmplitude" min="0" max="50" value="10" aria-valuemin="0" aria-valuemax="50" aria-valuenow="10" aria-valuetext="10">
                <span id="noiseAmplitudeValue" aria-hidden="true">10</span>
            </div>
            <div class="control-group">
                <label for="morphInterval">Morph Interval (ms):</label>
                <input type="range" id="morphInterval" min="500" max="8000" step="100" value="3500" aria-valuemin="500" aria-valuemax="8000" aria-valuenow="3500" aria-valuetext="3500 milliseconds">
                <span id="morphIntervalValue" aria-hidden="true">3500</span>
            </div>
            <div class="control-group">
                <label for="morphCornerCount">Morph Corners:</label>
                <input type="range" id="morphCornerCount" min="0" max="20" step="1" value="3" aria-valuemin="0" aria-valuemax="20" aria-valuenow="3" aria-valuetext="3">
                <span id="morphCornerCountValue" aria-hidden="true">3</span>
            </div>
            <div class="control-group">
                <button type="button" data-action="regenerate">Regenerate Puzzle</button>
                <button type="button" data-action="toggle-animation">Pause Animation</button>
                <button type="button" data-action="toggle-grid-outlines">Toggle Grid Outlines</button>
            </div>
        </div>
    </aside>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
