<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantasm</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Phantasm" />
    <link rel="manifest" href="/site.webmanifest" />    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="container">
        <div class="puzzle-container">
            <canvas id="voronoiCanvas"></canvas>
        </div>
    </div>
    
    <!-- Controls Drawer -->
    <div class="controls-drawer" id="controlsDrawer">
        <button class="drawer-toggle" id="drawerToggle" onclick="toggleDrawer()">
            <svg class="caret-icon" viewBox="0 0 24 24" width="16" height="16">
                <path d="M7 14l5-5 5 5z" fill="currentColor"/>
            </svg>
        </button>
        
        <div class="controls-content" id="controlsContent">
            <div class="control-group">
                <label for="cellCount">Cell Count:</label>
                <input type="range" id="cellCount" min="5" max="50" value="40">
                <span id="cellCountValue">40</span>
            </div>
            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.1" max="2.0" step="0.1" value="1.0">
                <span id="animationSpeedValue">1.0</span>
            </div>
            <div class="control-group">
                <label for="noiseAmplitude">Noise Amplitude:</label>
                <input type="range" id="noiseAmplitude" min="0" max="50" value="10">
                <span id="noiseAmplitudeValue">10</span>
            </div>
            <div class="control-group">
                <button onclick="regeneratePuzzle()">Regenerate Puzzle</button>
                <button onclick="toggleAnimation()">Toggle Animation</button>
                <button onclick="toggleGridOutlines()">Toggle Grid Outlines</button>
            </div>
        </div>
    </div>

    <!-- Debug System - Load FIRST -->
    <script src="debug-init.js"></script>
    
    <!-- External libraries -->
    <script src="node_modules/d3-delaunay/dist/d3-delaunay.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Shared modules -->
    <script src="noise.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/base.js"></script>
    
    <!-- Coordinate System Utilities -->
    <script src="js/coordinate-utils.js"></script>
    <script src="js/position-manager.js"></script>
    
    <!-- Theme System (ES Modules) -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/theme-manager.js"></script>
    
    <!-- WebGL 3D renderer -->
    <script src="js/webgl-renderer.js?v=25"></script>
    
    <!-- Main puzzle class -->
    <script src="js/main.js"></script>
    
    <!-- Debug tools - Load after main app is ready -->
    <script>
        // Load debug tools after main app is ready
        window.addEventListener('DOMContentLoaded', function() {
            if (window.SmartLogger && window.SmartLogger.categories) {
                SmartLogger.log('debug-tools', '🔧 Loading debug tools...');
                const debugScripts = [
                    'debug-tools/simple-precision-test.js',
                    'debug-tools/scene-state-diagnostic.js',
                    'debug-tools/drag-coordinate-diagnostic.js',
                    'debug-tools/position-shift-diagnostic.js',
                    'debug-tools/mouse-movement-correlation-diagnostic.js',
                    'debug-tools/coordinate-system-diagnostic.js',
                    'debug-tools/visual-debug-overlay.js',
                    'debug-tools/index.js'
                ];
                
                debugScripts.forEach((src, index) => {
                    setTimeout(() => {
                        const script = document.createElement('script');
                        script.src = src;
                        document.head.appendChild(script);
                    }, index * 100); // Stagger loading
                });
            }
        });
    </script>
    
    <script>
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', async () => {
            SmartLogger.log('initialization', 'Initializing Phantasm...');
            SmartLogger.log('initialization', 'Delaunay available:', typeof Delaunay !== 'undefined');
            SmartLogger.log('initialization', 'd3 available:', typeof d3 !== 'undefined');
            if (typeof d3 !== 'undefined') {
                SmartLogger.log('initialization', 'd3.Delaunay available:', typeof d3.Delaunay !== 'undefined');
            }
            
            // Small delay to ensure all scripts are loaded
            setTimeout(async () => {
                if (typeof VoronoiPuzzle === 'undefined') {
                    console.error('VoronoiPuzzle class not found. Check script loading order.');
                    return;
                }
                window.voronoiPuzzle = new VoronoiPuzzle();
                
                // Initialize theme system
                setTimeout(async () => {
                    try {
                        // Import theme manager
                        const { themeManager } = await import('./js/theme-manager.js');
                        
                        // Initialize with WebGL renderer reference
                        themeManager.init(window.voronoiPuzzle?.webglRenderer);
                        
                        // Load saved theme preference (no UI selector)
                        themeManager.loadThemePreference();
                        
                        // Make theme manager globally available for dev tools
                        window.themeManager = themeManager;
                        
                        SmartLogger.log('theme-changes', '🎨 Theme system initialized (dev mode)');
                        SmartLogger.log('debug-tools', '💡 Dev tools available:');
                        SmartLogger.log('debug-tools', '   themeManager.setTheme("fluidlock")');
                        SmartLogger.log('debug-tools', '   themeManager.getAvailableThemes()');
                        SmartLogger.log('debug-tools', '   themeManager.getCurrentTheme()');
                    } catch (error) {
                        console.warn('Theme system initialization failed:', error);
                    }
                }, 200);
            }, 100);
        });
        
        // Global functions for controls
        function regeneratePuzzle() {
            window.voronoiPuzzle?.regeneratePuzzle();
        }
        
        function toggleAnimation() {
            window.voronoiPuzzle?.toggleAnimation();
        }
        
        
        
        function toggleGridOutlines() {
            if (window.voronoiPuzzle && window.voronoiPuzzle.webglRenderer) {
                const isOn = window.voronoiPuzzle.webglRenderer.toggleGridOutlines();
                console.log(`🔗 Grid outlines toggled: ${isOn ? 'ON' : 'OFF'}`);
            } else {
                console.log('❌ Grid outline toggle only available in WebGL mode');
            }
        }
        
        function toggleDrawer() {
            const drawer = document.getElementById('controlsDrawer');
            const toggle = document.getElementById('drawerToggle');
            const caret = toggle.querySelector('.caret-icon');
            
            drawer.classList.toggle('open');
            
            // Rotate caret icon
            if (drawer.classList.contains('open')) {
                caret.style.transform = 'rotate(180deg)';
            } else {
                caret.style.transform = 'rotate(0deg)';
            }
        }
    </script>
</body>
</html>
