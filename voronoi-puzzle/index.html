<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantasm</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Phantasm" />
    <link rel="manifest" href="/site.webmanifest" />    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <svg class="heartbeat-gradient" width="238" height="232" viewBox="0 0 238 232" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="119" cy="116" rx="119" ry="116" fill="url(#paint0_radial_1354_28)" fill-opacity="0.8"/>
                <defs>
                    <radialGradient id="paint0_radial_1354_28" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(119 116) rotate(90) scale(116 119)">
                        <stop stop-color="#00CCFF"/>
                        <stop offset="1" stop-opacity="0"/>
                    </radialGradient>
                </defs>
            </svg>
        </div>
    </div>

    <div class="container">
        <div class="puzzle-container">
            <canvas id="voronoiCanvas"></canvas>
        </div>
    </div>
    
    <!-- Controls Drawer -->
    <div class="controls-drawer" id="controlsDrawer">
        <button class="drawer-toggle" id="drawerToggle" onclick="toggleDrawer()">
            <svg class="caret-icon" viewBox="0 0 24 24" width="16" height="16">
                <path d="M7 14l5-5 5 5z" fill="currentColor"/>
            </svg>
        </button>
        
        <div class="controls-content" id="controlsContent">
            <div class="control-group">
                <label for="levelSelector">Level:</label>
                <select id="levelSelector">
                    <option value="level-1">Level 1</option>
                    <option value="level-2">Level 2</option>
                </select>
            </div>
            <div class="control-group">
                <label for="cellCount">Cell Count:</label>
                <input type="range" id="cellCount" min="5" max="50" value="40">
                <span id="cellCountValue">40</span>
            </div>
            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.1" max="2.0" step="0.1" value="1.0">
                <span id="animationSpeedValue">1.0</span>
            </div>
            <div class="control-group">
                <label for="noiseAmplitude">Noise Amplitude:</label>
                <input type="range" id="noiseAmplitude" min="0" max="50" value="10">
                <span id="noiseAmplitudeValue">10</span>
            </div>
            <div class="control-group">
                <button onclick="regeneratePuzzle()">Regenerate Puzzle</button>
                <button onclick="toggleAnimation()">Toggle Animation</button>
                <button onclick="toggleGridOutlines()">Toggle Grid Outlines</button>
                <button onclick="toggleResponsiveCanvas()">Toggle Responsive Canvas</button>
            </div>
        </div>
    </div>

    <!-- Debug System - Load FIRST -->
    <script src="debug-init.js"></script>
    
    <!-- External libraries -->
    <script src="node_modules/d3-delaunay/dist/d3-delaunay.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Shared modules -->
    <script src="js/noise.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/base.js"></script>
    
    <!-- Coordinate System Utilities -->
    <script src="js/coordinate-utils.js"></script>
    <script src="js/position-manager.js"></script>
    
    <!-- Responsive Canvas System -->
    <script src="js/responsive-canvas.js"></script>
    
    <!-- Theme System (ES Modules) -->
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/theme-manager.js"></script>
    <script type="module" src="js/level-manager.js"></script>
    
    <!-- WebGL 3D renderer -->
    <script src="js/webgl-renderer.js?v=25"></script>
    
    <!-- Main puzzle class -->
    <script src="js/main.js"></script>
    
    <!-- Debug system disabled - using console.log for debugging -->
    
    <script>
        // Show loading screen immediately when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.add('visible');
            }
        });
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', async () => {
            SmartLogger.log('initialization', 'Initializing Phantasm...');
            SmartLogger.log('initialization', 'Delaunay available:', typeof Delaunay !== 'undefined');
            SmartLogger.log('initialization', 'd3 available:', typeof d3 !== 'undefined');
            if (typeof d3 !== 'undefined') {
                SmartLogger.log('initialization', 'd3.Delaunay available:', typeof d3.Delaunay !== 'undefined');
            }
            
            // Small delay to ensure all scripts are loaded
            setTimeout(async () => {
                if (typeof VoronoiPuzzle === 'undefined') {
                    console.error('VoronoiPuzzle class not found. Check script loading order.');
                    // Hide loading screen on error
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.classList.remove('visible');
                    }
                    return;
                }
                
                try {
                    window.voronoiPuzzle = new VoronoiPuzzle();
                } catch (error) {
                    console.error('Failed to create VoronoiPuzzle:', error);
                    // Hide loading screen on error
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.classList.remove('visible');
                    }
                    return;
                }
                
                // Initialize theme system
                setTimeout(async () => {
                    try {
                        // Import theme manager
                        const { themeManager } = await import('./js/theme-manager.js');
                        
                        // Initialize with WebGL renderer reference
                        themeManager.init(window.voronoiPuzzle?.webglRenderer);
                        
                        // Load saved theme preference (no UI selector)
                        themeManager.loadThemePreference();
                        
                        // Make theme manager globally available for dev tools
                        window.themeManager = themeManager;
                        
                        // Initialize level system after puzzle is fully ready
                        const initLevelSystem = async () => {
                            try {
                                // Wait for puzzle to be fully initialized
                                if (!window.voronoiPuzzle) {
                                    console.warn('Puzzle not ready yet, retrying in 200ms...');
                                    setTimeout(initLevelSystem, 200);
                                    return;
                                }
                                
                                // Import level manager
                                const { levelManager } = await import('./js/level-manager.js');
                                
                                // Initialize level manager
                                levelManager.init(window.voronoiPuzzle);
                                window.levelManager = levelManager;
                                
                                // Set up level selector event listener
                                const levelSelector = document.getElementById('levelSelector');
                                if (levelSelector) {
                                    levelSelector.addEventListener('change', handleLevelChange);
                                }
                                
                                // Initial level is now applied automatically in levelManager.init()
                                
                                SmartLogger.log('level-system', '🎮 Level system initialized');
                                
                                // Hide loading screen after everything is fully initialized
                                if (window.voronoiPuzzle && window.voronoiPuzzle.hideLoadingScreen) {
                                    window.voronoiPuzzle.hideLoadingScreen();
                                }
                            } catch (error) {
                                console.error('Level system initialization failed:', error);
                                // Hide loading screen even on error
                                if (window.voronoiPuzzle && window.voronoiPuzzle.hideLoadingScreen) {
                                    window.voronoiPuzzle.hideLoadingScreen();
                                }
                            }
                        };
                        
                        setTimeout(initLevelSystem, 500);
                        
                        SmartLogger.log('theme-changes', '🎨 Theme system initialized (dev mode)');
                        SmartLogger.log('debug-tools', '💡 Dev tools available:');
                        SmartLogger.log('debug-tools', '   themeManager.setTheme("fluidlock")');
                        SmartLogger.log('debug-tools', '   themeManager.getAvailableThemes()');
                        SmartLogger.log('debug-tools', '   themeManager.getCurrentTheme()');
                        SmartLogger.log('debug-tools', '   levelManager.setLevel("level-1")');
                        SmartLogger.log('debug-tools', '   levelManager.getAvailableLevels()');
                    } catch (error) {
                        console.warn('Theme system initialization failed:', error);
                        // Hide loading screen even if theme system fails
                        if (window.voronoiPuzzle && window.voronoiPuzzle.hideLoadingScreen) {
                            window.voronoiPuzzle.hideLoadingScreen();
                        }
                    }
                }, 200);
            }, 100);
        });
        
        // Global functions for controls
        function regeneratePuzzle() {
            window.voronoiPuzzle?.regeneratePuzzle();
        }
        
        // Level change handler
        async function handleLevelChange() {
            const levelSelector = document.getElementById('levelSelector');
            const selectedLevel = levelSelector.value;
            
            console.log(`🎮 UI: Level selector changed to: ${selectedLevel}`);
            
            if (window.levelManager) {
                console.log(`🎮 UI: Calling levelManager.setLevel("${selectedLevel}")`);
                await window.levelManager.setLevel(selectedLevel);
            } else {
                console.warn('Level manager not available');
            }
        }
        
        function toggleAnimation() {
            window.voronoiPuzzle?.toggleAnimation();
        }
        
        // Handle viewport resize
        window.addEventListener('resize', () => {
            if (window.responsiveCanvas) {
                window.responsiveCanvas.handleViewportResize();
            }
        });
        
        
        
        function toggleGridOutlines() {
            if (window.voronoiPuzzle && window.voronoiPuzzle.webglRenderer) {
                const isOn = window.voronoiPuzzle.webglRenderer.toggleGridOutlines();
                console.log(`🔗 Grid outlines toggled: ${isOn ? 'ON' : 'OFF'}`);
            } else {
                console.log('❌ Grid outline toggle only available in WebGL mode');
            }
        }
        
        function toggleDrawer() {
            const drawer = document.getElementById('controlsDrawer');
            const toggle = document.getElementById('drawerToggle');
            const caret = toggle.querySelector('.caret-icon');
            
            drawer.classList.toggle('open');
            
            // Rotate caret icon
            if (drawer.classList.contains('open')) {
                caret.style.transform = 'rotate(180deg)';
            } else {
                caret.style.transform = 'rotate(0deg)';
            }
        }
        
        function toggleResponsiveCanvas() {
            if (window.responsiveCanvas && window.voronoiPuzzle) {
                const currentMode = window.responsiveCanvas.isResponsive;
                window.responsiveCanvas.setResponsiveMode(!currentMode);
                
                // Re-setup canvas with new mode
                window.voronoiPuzzle.currentRenderer?.setupCanvas();
                
                // Regenerate puzzle to match new canvas size
                window.voronoiPuzzle.regeneratePuzzle();
                
                console.log(`🎨 Responsive canvas: ${!currentMode ? 'ENABLED' : 'DISABLED'}`);
            }
        }
    </script>
</body>
</html>
