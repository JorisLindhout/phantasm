<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voronoi Puzzle 2D - Canvas Version</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Voronoi Puzzle 2D</h1>
        <div class="puzzle-container">
            <div class="loading" id="loading">Loading puzzle...</div>
            <canvas id="voronoiCanvas"></canvas>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="cellCount">Cell Count:</label>
                <input type="range" id="cellCount" min="5" max="50" value="40">
                <span id="cellCountValue">40</span>
            </div>
            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.1" max="2.0" step="0.1" value="1.0">
                <span id="animationSpeedValue">1.0</span>
            </div>
            <div class="control-group">
                <label for="noiseAmplitude">Noise Amplitude:</label>
                <input type="range" id="noiseAmplitude" min="0" max="50" value="10">
                <span id="noiseAmplitudeValue">10</span>
            </div>
            <div class="control-group">
                <button onclick="regeneratePuzzle()">Regenerate Puzzle</button>
                <button onclick="toggleAnimation()">Toggle Animation</button>
            </div>
        </div>
        <div class="info">
            <p>Animated Voronoi cells with Canvas 2D rendering</p>
            <p id="rendererStatus">Renderer: Loading...</p>
        </div>
    </div>

    <!-- External libraries -->
    <script src="node_modules/d3-delaunay/dist/d3-delaunay.min.js"></script>
    
    <!-- Core modules -->
    <script src="noise.js"></script>
    <script src="js/shared/voronoi-utils.js"></script>
    <script src="js/shared/voronoi-base.js"></script>
    
    <!-- 2D renderer -->
    <script src="js/2d/canvas-renderer.js"></script>
    
    <!-- Main application -->
    <script src="voronoi-puzzle-2d.js"></script>
</body>
</html>
